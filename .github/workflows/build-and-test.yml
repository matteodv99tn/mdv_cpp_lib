name: C++ Build and Test

on:
  push:
    branches: [main, devel, devel-v2]
  pull_request:
    branches: [main, devel, devel-v2]

jobs:
  # clang-tidy diagnostics depend on the system headers: Arch is the reference platform.
  lint:
    name: archlinux / format + clang-tidy
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CC: clang
      CXX: clang++
      MDVCPPLIB_LLVM_CACHE_DIR: /opt/llvm-cache
    steps:
      - name: Install checkout prerequisites
        run: pacman -Syu --noconfirm --needed git zstd
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-arch
      - uses: actions/cache@v4
        with:
          path: ${{ env.MDVCPPLIB_LLVM_CACHE_DIR }}
          key: llvm-arch-${{ runner.arch }}-${{ hashFiles('scripts/get_llvm.sh') }}
      - name: Check formatting
        run: |
          ./scripts/run_clang_format.sh
          # The host-owned checkout is inspected by root inside the container.
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
      - name: Configure tests and Rerun executables
        run: >-
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DBUILD_EXECUTABLES=ON -DUSE_RERUN=ON
      # Only the matioCpp headers are generated at build time
      - name: Build generated headers
        run: cmake --build build --target matioCpp
      - name: Run clang-tidy
        run: ./scripts/run_clang_tidy.sh

  build-arch:
    name: archlinux / ${{ matrix.compiler.name }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - {name: GCC, cc: gcc, cxx: g++}
          - {name: Clang, cc: clang, cxx: clang++}
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Install checkout prerequisites
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-arch
      - name: Configure tests and Rerun executables
        run: >-
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON -DBUILD_EXECUTABLES=ON -DUSE_RERUN=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --parallel 2 --output-on-failure --no-tests=error

  build-ubuntu:
    name: ${{ matrix.os }} / ${{ matrix.compiler.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
        compiler:
          - {name: GCC, cc: gcc, cxx: g++}
          - {name: Clang, cc: clang, cxx: clang++}
        build_type: [Debug]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo ./cmake/install_dependencies.sh
          sudo apt-get install -y clang curl
      - name: Install precompiled Rerun SDK
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/rerun-sdk.deb" \
            https://github.com/matteodv99tn/rerun-sdk-precompiled/releases/download/v0.25.1/rerun-cpp-sdk_0.25_1.deb
          sudo apt-get install -y "$RUNNER_TEMP/rerun-sdk.deb"
      - name: Build external dependencies
        run: |
          cmake -S cmake -B cmake/build
          cmake --build cmake/build --parallel 2
      - name: Configure tests and Rerun executables
        run: >-
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON -DBUILD_EXECUTABLES=ON -DUSE_RERUN=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --parallel 2 --output-on-failure --no-tests=error
