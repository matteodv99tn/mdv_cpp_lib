default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: ./scripts/run_clang_format.sh
        language: system
        types_or: [c++, c]
        exclude: ^third_party/
        stages: [pre-commit]
      - id: clang-tidy
        name: clang-tidy
        entry: ./scripts/run_clang_tidy.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: clean-build-and-test
        name: clean build and test
        entry: ./scripts/run_clean_build.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
